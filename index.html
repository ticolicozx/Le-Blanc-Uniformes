<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Le Blanc Uniformes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

body {
  background: #000;
  color: #d4af37;
}

/* TOPO */
.top-bar {
  background: #222;
  color: #d4af37;
  text-align: center;
  padding: 6px;
  font-size: 14px;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 30px;
  position: relative;
  z-index: 1000;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

/* HAMBURGUER */
.menu-btn {
  font-size: 28px;
  cursor: pointer;
  z-index: 2001;
}

/* MENU LATERAL */
.side-menu {
  position: fixed;
  top: 0;
  right: -260px;
  width: 260px;
  height: 100%;
  background: #111;
  padding: 80px 20px;
  transition: 0.3s;
  z-index: 2000;
}

.side-menu a {
  display: block;
  color: #d4af37;
  text-decoration: none;
  margin-bottom: 18px;
}

/* HERO */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 40px;
  gap: 40px;
  align-items: center;
}

/* PESQUISA */
.search-box {
  width: 100%;
  display: flex;
  justify-content: center;
  margin: 30px 0;
}

.search-box input {
  width: 420px;
  max-width: 90%;
  padding: 14px 20px;
  border-radius: 30px;
  border: none;
  background: #333;
  color: #fff;
  font-size: 16px;
}

/* TEXTO */
.hero-text h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

.hero-text p {
  color: #aaa;
  margin-bottom: 20px;
}

.hero-text button {
  background: #d4af37;
  color: #000;
  border: none;
  padding: 12px 28px;
  border-radius: 30px;
  cursor: pointer;
}

/* SLIDER */
.slider {
  background: #666;
  height: 280px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  position: relative;
}

.slider button {
  position: absolute;
  background: rgba(0,0,0,0.5);
  border: none;
  color: #fff;
  font-size: 22px;
  padding: 8px 12px;
  cursor: pointer;
}

.prev { left: 10px; }
.next { right: 10px; }

/* MOBILE */
@media(max-width: 900px){
  .hero {
    grid-template-columns: 1fr;
    text-align: center;
  }
}
</style>
</head>

<body>

<div class="top-bar">
🚚 Enviamos para todo o Brasil - Pagamento à vista 3% OFF
</div>

<header>
  <div class="logo">LE BLANC UNIFORMES</div>
  <div class="menu-btn" id="menuBtn">☰</div>
</header>

<nav class="side-menu" id="sideMenu">
  <a href="#">Jaleco Masculino</a>
  <a href="#">Jaleco Feminino</a>
  <a href="#">Uniformes</a>
  <a href="#">Aventais</a>
  <a href="#">Suporte</a>
  <a href="#">Sobre Nós</a>
</nav>

<!-- PESQUISA NA POSIÇÃO CORRETA -->
<div class="search-box">
  <input type="text" placeholder="O que você procura? Ex: Jaleco Feminino">
</div>

<section class="hero">
  <div class="hero-text">
    <h1>Elegância que veste<br>o profissional</h1>
    <p>Acabamentos de alto padrão pensados para quem exige excelência.</p>
    <button>Ver Produtos</button>
  </div>

  <div class="slider">
    <button class="prev">‹</button>
    <div>Imagem em Breve</div>
    <button class="next">›</button>
  </div>
</section>

<script>
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");

let aberto = false;

menuBtn.onclick = () => {
  aberto = !aberto;
  sideMenu.style.right = aberto ? "0" : "-260px";
  menuBtn.innerText = aberto ? "✕" : "☰";
};
</script>

</body>
</html>
