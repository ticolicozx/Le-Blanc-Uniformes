<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Blanc Uniformes</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#d4af37;
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  z-index:1000;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);
}
.logo{
  font-family:'Playfair Display',serif;
  font-size:26px;
}
.hamburger{
  width:30px;
  cursor:pointer;
}
.hamburger span{
  display:block;
  height:2px;
  background:#d4af37;
  margin:6px 0;
  transition:.4s;
}
.hamburger.active span:nth-child(1){
  transform:rotate(45deg) translate(6px,6px);
}
.hamburger.active span:nth-child(2){
  opacity:0;
}
.hamburger.active span:nth-child(3){
  transform:rotate(-45deg) translate(6px,-6px);
}

/* MENU */
.menu{
  position:fixed;
  left:-100%;
  top:0;
  width:100%;
  height:100vh;
  background:#000;
  padding:100px 40px;
  transition:.5s;
  z-index:999;
}
.menu.active{left:0}
.menu a{
  display:block;
  color:#d4af37;
  font-size:26px;
  margin-bottom:20px;
  text-decoration:none;
  font-family:'Playfair Display',serif;
}

/* HERO SLIDES */
.hero{
  height:100vh;
  display:flex;
  overflow:hidden;
}
.slide{
  min-width:100%;
  background:url('placeholder.png') center/cover no-repeat;
  animation:slide 18s infinite;
}
@keyframes slide{
  0%{transform:translateX(0)}
  33%{transform:translateX(-100%)}
  66%{transform:translateX(-200%)}
}

/* SECTIONS */
section{
  padding:100px 8%;
}
.title{
  font-family:'Playfair Display',serif;
  font-size:38px;
  margin-bottom:40px;
}

/* PRODUTOS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
}
.card{
  background:#111;
  padding:20px;
  transition:.4s;
}
.card:hover{transform:translateY(-8px)}
.card img{
  width:100%;
}
.card h3{
  margin-top:15px;
  font-weight:400;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#fff;
  text-decoration:none;
  z-index:1000;
}
</style>
</head>

<body>

<header>
  <div class="logo">Le Blanc</div>
  <div class="hamburger" onclick="toggleMenu(this)">
    <span></span><span></span><span></span>
  </div>
</header>

<div class="menu" id="menu">
  <a href="#">Jalecos</a>
  <a href="#">Uniformes Hospitalares</a>
  <a href="#">Linha Premium</a>
  <a href="#">Contato</a>
</div>

<div class="hero">
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
</div>

<section>
  <div class="title">Linha Profissional</div>
  <div class="products">
    <div class="card">
      <img src="placeholder.png">
      <h3>Jaleco Premium Feminino</h3>
    </div>
    <div class="card">
      <img src="placeholder.png">
      <h3>Jaleco Masculino Slim</h3>
    </div>
    <div class="card">
      <img src="placeholder.png">
      <h3>Jaleco Personalizado</h3>
    </div>
  </div>
</section>

<a class="whatsapp" href="https://wa.me/5541998096090" target="_blank">🟢</a>

<script>
function toggleMenu(el){
  el.classList.toggle('active');
  document.getElementById('menu').classList.toggle('active');
}
</script>

</body>
</html>
