<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Blanc Uniformes</title>
  <meta name="theme-color" content="#000000">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Montserrat', sans-serif; }
    body { background:#000; color:#d4af37; display:flex; justify-content:center; min-height:100vh; }
    .app { width:100%; max-width:1200px; }

    /* HEADER */
    header { padding:28px 40px; display:flex; justify-content:space-between; align-items:center; transition:0.3s; }
    header h1 { font-family: 'Playfair Display', serif; font-size:24px; letter-spacing:2px; }
    header nav a { color:#d4af37; text-decoration:none; margin-left:24px; font-size:14px; opacity:0.85; transition:0.3s; }
    header nav a:hover { opacity:1; }

    /* HERO */
    .hero { display:grid; grid-template-columns:1fr 1fr; gap:40px; padding:60px 40px; align-items:center; }
    .hero-text h2 { font-family: 'Playfair Display', serif; font-size:36px; line-height:1.2; margin-bottom:20px; }
    .hero-text p { font-size:15px; opacity:0.85; margin-bottom:30px; max-width:420px; }
    .hero-text button {
      padding:14px 32px; border-radius:30px; border:none;
      background:#d4af37; color:#000; font-size:13px; font-weight:600; letter-spacing:1px;
      cursor:pointer; transition:0.3s;
    }
    .hero-text button:hover { background:#c49c2d; }

    /* IMAGENS DOS JALECOS */
    .hero-images { display:flex; gap:20px; justify-content:center; }
    .jaleco {
      width:180px; height:320px; border-radius:120px 120px 24px 24px;
      background-size:cover; background-position:center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor:pointer;
    }
    .jaleco:hover { transform: translateY(-10px); box-shadow:0 15px 25px rgba(212,175,55,0.3); }

    .branco { background-image: url("assets/img/jaleco-branco.jpg"); }
    .rosa { background-image: url("assets/img/jaleco-rosa.jpg"); }
    .azul { background-image: url("assets/img/jaleco-azul.jpg"); }

    /* SEÇÃO INFERIOR */
    .section { padding:80px 40px; border-top:1px solid rgba(212,175,55,0.2); text-align:center; }
    .section h3 { font-size:24px; font-weight:400; margin-bottom:20px; }
    .section p { font-size:14px; max-width:600px; margin:0 auto; opacity:0.8; line-height:1.6; }

    /* RESPONSIVO */
    @media (max-width:900px){
      .hero { grid-template-columns:1fr; text-align:center; }
      .hero-images { margin-top:40px; flex-wrap:wrap; justify-content:center; gap:15px; }
      header { flex-direction:column; gap:16px; }
      .hero-text button { width:100%; max-width:250px; }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header>
      <h1>LE BLANC UNIFORMES</h1>
      <nav>
        <a href="#">Início</a>
        <a href="#">Catálogo</a>
        <a href="#">Contato</a>
      </nav>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-text">
        <h2>Elegância que veste<br>o profissional</h2>
        <p>Jalecos e uniformes premium que unem conforto, estilo e identidade profissional.</p>
        <button onclick="window.open('https://wa.me/5541984493134','_blank')">FALE CONOSCO</button>
      </div>

      <div class="hero-images">
        <div class="jaleco branco"></div>
        <div class="jaleco rosa"></div>
        <div class="jaleco azul"></div>
      </div>
    </section>

    <!-- SEÇÃO INFERIOR -->
    <section class="section">
      <h3>Uniformes com identidade</h3>
      <p>Criamos peças que valorizam sua imagem profissional, com acabamentos de alto padrão e design moderno.</p>
    </section>

  </div>
</body>
</html>
