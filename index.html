<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Blanc Uniformes</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;
  --black:#000;
  --gray:#1a1a1a;
  --space:#7a7a7a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}

body{
  background:var(--black);
  color:var(--gold);
  overflow-x:hidden;
}

/* TOPO */
.top-bar{
  background:#222;
  text-align:center;
  padding:8px;
  font-size:13px;
  position: relative;
  z-index: 1200;
}

/* HEADER - Ajustado para ficar sempre no topo */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  position: sticky;
  top: 0;
  background: var(--black);
  z-index:1100; /* Fica acima do menu lateral */
  border-bottom: 1px solid rgba(212, 175, 55, 0.1);
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-area img{height:50px;}

.logo-area h1{
  font-size:20px;
  letter-spacing:2px;
  font-weight:500;
}

.menu-btn{
  font-size:28px;
  cursor:pointer;
  z-index:1101; /* Garante que o botão de fechar/abrir seja clicável */
  width: 30px;
  text-align: center;
}

/* MENU LATERAL - Ajustado para não sobrepor o título */
.side-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:280px;
  height:100vh;
  background:#0f0f0f;
  padding:100px 30px 30px; /* Padding superior para os itens aparecerem abaixo do header */
  transition:.4s;
  z-index:1000;
  box-shadow: -5px 0 15px rgba(0,0,0,0.5);
}

.side-menu.active{right:0;}

.side-menu a{
  display:block;
  margin-bottom:20px;
  text-decoration:none;
  color:var(--gold);
  font-size: 18px;
  cursor: pointer;
}

.submenu{
  margin-left:15px;
  display:none;
  margin-bottom: 20px;
}

.submenu a {
    font-size: 15px;
    margin-bottom: 12px;
    opacity: 0.8;
}

/* HERO */
.hero{
  padding:50px 30px 10px;
  max-width:1200px;
  margin:auto;
  text-align:center;
}

.hero h2{
  font-size:42px;
  font-weight:400;
}

.hero p{
  margin:15px auto;
  max-width:620px;
  opacity:.85;
}

/* BUSCA */
.search-box{
  max-width:600px;
  margin:25px auto 0;
}

.search-box input{
  width:100%;
  padding:14px 22px;
  border-radius:30px;
  border:none;
  background:#1f1f1f;
  color:#fff;
  font-size:14px;
  outline:none;
}

/* ===== SLIDER 1:1 ===== */
.slider-wrapper{
  width:100%;
  max-width:1200px;
  margin:60px auto 0;
  position:relative;
  padding:0 30px;
  display:flex;
  justify-content:center;
}

.slider{
  width:520px;
  height:520px; 
  overflow:hidden;
  border-radius:28px;
  position:relative;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .7s ease;
}

.slide.active{opacity:1;}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SETAS */
.slider-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  font-size:48px;
  color:var(--space);
  cursor:pointer;
}

.slider-arrow.left{left:-60px;}
.slider-arrow.right{right:-60px;}

/* LOJA */
.store{
  display:none;
  padding:60px 30px 80px;
  max-width:1200px;
  margin:auto;
}

.store-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.back-btn{
  background:none;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:30px;
}

.product{
  background:var(--gray);
  padding:20px;
  border-radius:22px;
  text-align:center;
}

.product img{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:18px;
  margin-bottom:15px;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;
  height:56px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  text-decoration:none;
  color:#fff;
  z-index: 100;
}

/* MOBILE */
@media(max-width:768px){
  .hero h2{font-size:32px;}

  .slider{
    width:280px;
    height:280px;
  }

  .slider-arrow.left{left:-40px;}
  .slider-arrow.right{right:-40px;}
  
  .logo-area h1 { font-size: 16px; }
  .logo-area img { height: 40px; }
}
</style>
</head>

<body>

<div class="top-bar">
🚚 Enviamos para todo o Brasil • Pagamento à vista 3% OFF
</div>

<header>
  <div class="logo-area">
    <img src="assets/img/logo.png" alt="Logo">
    <h1>LE BLANC UNIFORMES</h1>
  </div>
  <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">☰</div>
</header>

<div class="side-menu" id="menu">
  <a href="#" onclick="toggleSub()">Loja ▾</a>
  <div class="submenu" id="submenu">
    <a onclick="openStore('Jalecos Masculinos')">Jalecos Masculinos</a>
    <a onclick="openStore('Jalecos Femininos')">Jalecos Femininos</a>
    <a onclick="openStore('Uniformes')">Uniformes</a>
    <a onclick="openStore('Aventais')">Aventais</a>
  </div>
  <a>Suporte</a>
  <a>Sobre Nós</a>
</div>

<section class="hero" id="home">
  <h2>Elegância que veste o profissional</h2>
  <p>Qualidade, durabilidade e acabamento de alto padrão.</p>

  <div class="search-box">
    <input type="text" placeholder="Buscar por jalecos, uniformes, aventais..." onkeyup="searchProduct(event)">
  </div>
</section>

<div class="slider-wrapper">
  <button class="slider-arrow left" onclick="prevSlide()">‹</button>

  <div class="slider" id="slider">
    <div class="slide active"><img src="assets/img/imagem-1.png"></div>
    <div class="slide"><img src="assets/img/imagem-2.png"></div>
    <div class="slide"><img src="assets/img/imagem-3.png"></div>
    <div class="slide"><img src="assets/img/imagem-4.png"></div>
  </div>

  <button class="slider-arrow right" onclick="nextSlide()">›</button>
</div>

<section class="store" id="store">
  <div class="store-top">
    <h3 id="storeTitle"></h3>
    <button class="back-btn" onclick="goHome()">← Voltar</button>
  </div>
  <div class="products" id="products"></div>
</section>

<a class="whatsapp" href="https://wa.me/5541998096090" target="_blank">💬</a>

<script>
/* MENU */
const menu = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");
const submenu = document.getElementById("submenu");
const home = document.getElementById("home");
const store = document.getElementById("store");
const storeTitle = document.getElementById("storeTitle");
const products = document.getElementById("products");

function toggleMenu(){
  menu.classList.toggle("active");
  menuBtn.textContent = menu.classList.contains("active") ? "✕" : "☰";
}

function toggleSub(){
  submenu.style.display = submenu.style.display === "block" ? "none" : "block";
}

/* BUSCA */
function searchProduct(e){
  if(e.key === "Enter"){
    const v = e.target.value.toLowerCase();
    if(v.includes("fem")) openStore("Jalecos Femininos");
    else if(v.includes("masc")) openStore("Jalecos Masculinos");
    else if(v.includes("av")) openStore("Aventais");
    else openStore("Uniformes");
  }
}

/* LOJA */
function openStore(title){
  menu.classList.remove("active");
  menuBtn.textContent = "☰";
  home.style.display = "none";
  document.querySelector(".slider-wrapper").style.display = "none";
  store.style.display = "block";
  storeTitle.innerText = title;
  products.innerHTML = "";
  for(let i=1; i<=6; i++){
    products.innerHTML += `
      <div class="product">
        <img src="assets/img/placeholder.png">
        <h4>${title} ${i}</h4>
        <span>R$ 100,00</span>
      </div>`;
  }
  window.scrollTo(0,0);
}

function goHome(){
  store.style.display = "none";
  home.style.display = "block";
  document.querySelector(".slider-wrapper").style.display = "flex";
  window.scrollTo(0,0);
}

/* SLIDER */
let current = 0;
const slides = document.querySelectorAll(".slide");

function showSlide(i){
  slides.forEach(s => s.classList.remove("active"));
  slides[i].classList.add("active");
}

function nextSlide(){
  current = (current + 1) % slides.length;
  showSlide(current);
}

function prevSlide(){
  current = (current - 1 + slides.length) % slides.length;
  showSlide(current);
}

setInterval(nextSlide, 4000);

/* SWIPE */
let startX = 0;
const sliderElem = document.getElementById("slider");
sliderElem.addEventListener("touchstart", e => startX = e.touches[0].clientX);
sliderElem.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  if(startX - endX > 50) nextSlide();
  if(endX - startX > 50) prevSlide();
});
</script>

</body>
</html>
