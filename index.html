<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Blanc Uniformes</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;
  --black:#000;
  --gray:#1a1a1a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}

body{
  background:var(--black);
  color:var(--gold);
}

/* FAIXA TOPO */
.top-bar{
  background:#222;
  text-align:center;
  padding:8px;
  font-size:13px;
  letter-spacing:1px;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-area img{
  height:50px;
}

.logo-area h1{
  font-size:20px;
  letter-spacing:2px;
  font-weight:500;
}

.menu-btn{
  font-size:26px;
  cursor:pointer;
}

/* MENU LATERAL */
.side-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:280px;
  height:100vh;
  background:#0f0f0f;
  padding:30px;
  transition:.4s;
  z-index:999;
}

.side-menu.active{
  right:0;
}

.side-menu a{
  display:block;
  margin-bottom:20px;
  text-decoration:none;
  color:var(--gold);
  font-size:16px;
}

.submenu{
  margin-left:15px;
  display:none;
}

.submenu a{
  font-size:14px;
  opacity:.85;
}

/* HERO */
.hero{
  padding:80px 30px;
  max-width:1100px;
  margin:auto;
}

.hero h2{
  font-size:42px;
  font-weight:400;
  line-height:1.2;
}

.hero p{
  margin:20px 0 30px;
  max-width:520px;
  opacity:.85;
}

.hero button{
  background:var(--gold);
  color:#000;
  border:none;
  padding:14px 36px;
  border-radius:30px;
  cursor:pointer;
  font-size:14px;
}

/* LOJA */
.store{
  display:none;
  padding:60px 30px;
  max-width:1200px;
  margin:auto;
}

.store h3{
  font-size:32px;
  margin-bottom:30px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:30px;
}

.product{
  background:var(--gray);
  border-radius:20px;
  padding:20px;
  text-align:center;
  transition:.3s;
}

.product:hover{
  transform:translateY(-6px);
}

.product img{
  width:100%;
  border-radius:15px;
  margin-bottom:15px;
}

.product h4{
  font-size:16px;
  margin-bottom:8px;
}

.product span{
  display:block;
  margin-bottom:15px;
}

.product button{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
}

/* RESPONSIVO */
@media(max-width:768px){
  .hero h2{font-size:32px;}
}
</style>
</head>

<body>

<div class="top-bar">
🚚 Enviamos para todo o Brasil • Pagamento à vista 3% OFF
</div>

<header>
  <div class="logo-area">
    <img src="assets/img/logo.png">
    <h1>LE BLANC UNIFORMES</h1>
  </div>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</header>

<div class="side-menu" id="menu">
  <a href="#" onclick="toggleSub()">Loja ▾</a>
  <div class="submenu" id="submenu">
    <a href="#" onclick="openStore('jaleco')">Jalecos</a>
    <a href="#" onclick="openStore('uniforme')">Uniformes</a>
    <a href="#" onclick="openStore('avental')">Aventais</a>
  </div>
  <a href="#">Suporte</a>
  <a href="#">Sobre Nós</a>
</div>

<section class="hero" id="home">
  <h2>Elegância que veste<br>o profissional</h2>
  <p>Uniformes premium com design moderno, conforto e identidade profissional.</p>
  <button onclick="openStore('jaleco')">Ver Produtos</button>
</section>

<section class="store" id="store">
  <h3 id="storeTitle"></h3>
  <div class="products" id="products"></div>
</section>

<script>
const productsData = {
  jaleco: ["Jaleco Premium","Jaleco Slim","Jaleco Clássico"],
  uniforme:["Uniforme Social","Uniforme Profissional"],
  avental:["Avental Executivo","Avental Premium"]
};

function toggleMenu(){
  document.getElementById("menu").classList.toggle("active");
}

function toggleSub(){
  document.getElementById("submenu").style.display =
  document.getElementById("submenu").style.display === "block" ? "none" : "block";
}

function openStore(type){
  document.getElementById("menu").classList.remove("active");
  document.getElementById("home").style.display="none";
  document.getElementById("store").style.display="block";

  document.getElementById("storeTitle").innerText = type.toUpperCase();

  const container = document.getElementById("products");
  container.innerHTML = "";

  productsData[type].forEach(p=>{
    container.innerHTML += `
      <div class="product">
        <img src="assets/img/placeholder.png">
        <h4>${p}</h4>
        <span>R$ 100,00</span>
        <button onclick="window.open('https://wa.me/5541998096090')">
          Comprar no WhatsApp
        </button>
      </div>
    `;
  });
}
</script>

</body>
</html>
