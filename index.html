<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Blanc Uniformes</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;
  --black:#000;
  --gray:#1a1a1a;
  --dark:#0f0f0f;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}

body{
  background:var(--black);
  color:var(--gold);
}

/* TOPO */
.top-bar{
  background:#222;
  text-align:center;
  padding:8px;
  font-size:13px;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  position:relative;
  z-index:1001;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-area img{
  height:50px;
}

.logo-area h1{
  font-size:20px;
  letter-spacing:2px;
  font-weight:500;
}

.menu-btn{
  font-size:28px;
  cursor:pointer;
  z-index:1002;
}

/* MENU LATERAL */
.side-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:280px;
  height:100vh;
  background:var(--dark);
  padding:30px;
  transition:.4s;
  z-index:1000;
}

.side-menu.active{
  right:0;
}

.side-menu a{
  display:block;
  margin-bottom:18px;
  text-decoration:none;
  color:var(--gold);
  font-size:16px;
}

.submenu{
  margin-left:15px;
  display:none;
}

.submenu a{
  font-size:14px;
  opacity:.85;
}

/* HERO */
.hero{
  max-width:1200px;
  margin:auto;
  padding:60px 30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}

.hero h2{
  font-size:42px;
  font-weight:400;
}

.hero p{
  margin:18px 0;
  max-width:520px;
  opacity:.85;
}

.search-box{
  margin:20px 0;
}

.search-box input{
  width:100%;
  max-width:420px;
  padding:14px 18px;
  border-radius:30px;
  border:none;
  outline:none;
  background:#2a2a2a;
  color:#fff;
}

.hero button{
  background:var(--gold);
  color:#000;
  border:none;
  padding:14px 36px;
  border-radius:30px;
  cursor:pointer;
}

/* SLIDER */
.slider{
  position:relative;
  background:#2a2a2a;
  border-radius:22px;
  overflow:hidden;
  height:300px;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:.6s;
}

.slide.active{
  opacity:1;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  font-size:22px;
  padding:8px 14px;
  cursor:pointer;
}

.prev{left:10px;}
.next{right:10px;}

/* LOJA */
.store{
  display:none;
  padding:40px 30px 80px;
  max-width:1200px;
  margin:auto;
}

.store-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.back-btn{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
}

.store h3{
  font-size:32px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:30px;
}

.product{
  background:var(--gray);
  border-radius:22px;
  padding:20px;
  text-align:center;
}

.product img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:15px;
}

.product button{
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:10px 22px;
  border-radius:20px;
  cursor:pointer;
}

@media(max-width:900px){
  .hero{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="top-bar">
🚚 Enviamos para todo o Brasil • Pagamento à vista 3% OFF
</div>

<header>
  <div class="logo-area">
    <img src="assets/img/logo.png">
    <h1>LE BLANC UNIFORMES</h1>
  </div>
  <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">☰</div>
</header>

<div class="side-menu" id="menu">
  <a href="#" onclick="toggleSub()">Loja ▾</a>
  <div class="submenu" id="submenu">
    <a href="#" onclick="openStore('Jaleco Masculino')">Jaleco Masculino</a>
    <a href="#" onclick="openStore('Jaleco Feminino')">Jaleco Feminino</a>
    <a href="#" onclick="openStore('Uniformes')">Uniformes</a>
    <a href="#" onclick="openStore('Aventais')">Aventais</a>
  </div>
  <a href="#">Suporte</a>
  <a href="#">Sobre Nós</a>
</div>

<section class="hero" id="home">
  <div>
    <h2>Elegância que veste<br>o profissional</h2>
    <p>Acabamentos de alto padrão pensados para quem exige excelência.</p>

    <div class="search-box">
      <input type="text" id="search" placeholder="Pesquisar produtos..." onkeydown="if(event.key==='Enter') searchProduct()">
    </div>

    <button onclick="openStore('Jaleco Masculino')">Ver Produtos</button>
  </div>

  <div class="slider">
    <div class="slide active"><img src="assets/img/imagem-1.png"></div>
    <div class="slide"><img src="assets/img/imagem-2.png"></div>
    <div class="slide"><img src="assets/img/imagem-3.png"></div>
    <div class="slide"><img src="assets/img/imagem-4.png"></div>

    <button class="slider-btn prev" onclick="prevSlide()">‹</button>
    <button class="slider-btn next" onclick="nextSlide()">›</button>
  </div>
</section>

<section class="store" id="store">
  <div class="store-top">
    <h3 id="storeTitle"></h3>
    <button class="back-btn" onclick="goHome()">← Voltar</button>
  </div>
  <div class="products" id="products"></div>
</section>

<script>
let menuOpen=false;

function toggleMenu(){
  menuOpen=!menuOpen;
  document.getElementById("menu").classList.toggle("active");
  document.getElementById("menuBtn").innerText = menuOpen ? "✕" : "☰";
}

function toggleSub(){
  const sub=document.getElementById("submenu");
  sub.style.display=sub.style.display==="block"?"none":"block";
}

function openStore(title){
  toggleMenu();
  document.getElementById("home").style.display="none";
  document.getElementById("store").style.display="block";
  document.getElementById("storeTitle").innerText=title;

  const c=document.getElementById("products");
  c.innerHTML="";
  for(let i=1;i<=6;i++){
    c.innerHTML+=`
    <div class="product">
      <img src="assets/img/placeholder.png">
      <h4>${title} ${i}</h4>
      <span>R$ 100,00</span>
      <button onclick="window.open('https://wa.me/5541998096090')">Comprar no WhatsApp</button>
    </div>`;
  }
}

function goHome(){
  document.getElementById("store").style.display="none";
  document.getElementById("home").style.display="grid";
}

function searchProduct(){
  const q=document.getElementById("search").value.toLowerCase();
  if(q.includes("femin")) openStore("Jaleco Feminino");
  else if(q.includes("masc")) openStore("Jaleco Masculino");
  else if(q.includes("avental")) openStore("Aventais");
  else openStore("Uniformes");
}

/* SLIDER */
let index=0;
const slides=document.querySelectorAll(".slide");

function showSlide(i){
  slides.forEach(s=>s.classList.remove("active"));
  slides[i].classList.add("active");
}

function nextSlide(){
  index=(index+1)%slides.length;
  showSlide(index);
}

function prevSlide(){
  index=(index-1+slides.length)%slides.length;
  showSlide(index);
}

setInterval(nextSlide,3000);
</script>

</body>
</html>
