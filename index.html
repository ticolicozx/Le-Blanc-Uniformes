<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Blanc Uniformes</title>

  <meta name="theme-color" content="#000000" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: #000000;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #000000;
      color: #d4af37;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(212,175,55,0.3);
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    header p {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 6px;
    }

    main {
      flex: 1;
      padding: 20px 16px;
    }

    .hero {
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .hero h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 14px;
      opacity: 0.85;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      border: 1px solid rgba(212,175,55,0.3);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
    }

    .card h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 12px;
      opacity: 0.8;
    }

    .cta {
      margin-top: 24px;
    }

    .cta button {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #d4af37, #b8962e);
      color: #000000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    nav {
      display: flex;
      border-top: 1px solid rgba(212,175,55,0.3);
    }

    nav button {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      color: #d4af37;
      font-size: 12px;
      cursor: pointer;
    }

    nav button.active {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Le Blanc Uniformes</h1>
      <p>Elegância e profissionalismo</p>
    </header>

    <main>
      <div class="hero">
        <h2>Uniformes Premium</h2>
        <p>Modelos profissionais e personalizados para empresas, escolas e equipes.</p>
      </div>

      <div class="grid">
        <div class="card">
          <h3>Escolares</h3>
          <p>Conforto e durabilidade</p>
        </div>
        <div class="card">
          <h3>Empresariais</h3>
          <p>Imagem profissional</p>
        </div>
        <div class="card">
          <h3>Hospitalares</h3>
          <p>Qualidade e padrão</p>
        </div>
        <div class="card">
          <h3>Personalizados</h3>
          <p>Exclusivos para sua marca</p>
        </div>
      </div>

      <div class="cta">
        <button onclick="window.open('https://wa.me/5541984493134','_blank')">Falar no WhatsApp</button>
      </div>
    </main>

    <nav>
      <button class="active">Home</button>
      <button>Catálogo</button>
      <button>Contato</button>
    </nav>
  </div>
</body>
</html>
