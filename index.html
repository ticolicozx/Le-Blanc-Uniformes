<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Blanc Uniformes</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;
  --black:#000;
  --gray:#1a1a1a;
  --space:#7a7a7a;
  --overlay: rgba(0,0,0,0.8);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Montserrat',sans-serif;
}

body{
  background:var(--black);
  color:var(--gold);
  overflow-x:hidden;
}

/* TOPO */
.top-bar{
  background:#222;
  text-align:center;
  padding:8px;
  font-size:13px;
  position: relative;
  z-index: 1001;
}

/* HEADER FIXO */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  position: sticky;
  top: 0;
  background: var(--black);
  z-index:1000;
  border-bottom: 1px solid rgba(212, 175, 55, 0.1);
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-area img{height:45px;}

.logo-area h1{
  font-size:18px;
  letter-spacing:2px;
  font-weight:500;
}

.menu-btn{
  font-size:28px;
  cursor:pointer;
  z-index:2001; /* Botão sempre acima de tudo */
  color: var(--gold);
  transition: 0.3s;
}

/* MENU LATERAL - CORRIGIDO */
.side-menu{
  position:fixed;
  top:0;
  right:-100%;
  width:320px;
  height:100vh;
  background:#0f0f0f;
  padding:100px 40px 40px;
  transition:.4s ease-in-out;
  z-index:2000; /* Camada superior */
  box-shadow: -10px 0 30px rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
}

.side-menu.active{right:0;}

.side-menu a{
  display:block;
  margin-bottom:25px;
  text-decoration:none;
  color:var(--gold);
  font-size: 20px;
  font-weight: 400;
  cursor: pointer;
}

.submenu{
  margin-left:20px;
  display:none;
  margin-bottom: 20px;
  border-left: 1px solid var(--gold);
  padding-left: 15px;
}

.submenu a {
    font-size: 16px;
    margin-bottom: 15px;
    opacity: 0.7;
}

/* HERO */
.hero{
  padding:60px 20px 20px;
  max-width:1200px;
  margin:auto;
  text-align:center;
}

.hero h2{
  font-size: clamp(28px, 5vw, 42px);
  font-weight:400;
}

.hero p{
  margin:15px auto;
  max-width:620px;
  opacity:.85;
}

/* BUSCA */
.search-box{
  max-width:600px;
  margin:30px auto 0;
}

.search-box input{
  width:100%;
  padding:16px 25px;
  border-radius:30px;
  border:1px solid rgba(212, 175, 55, 0.2);
  background:#111;
  color:#fff;
  font-size:14px;
  outline:none;
}

/* SLIDER 1:1 */
.slider-wrapper{
  width:100%;
  max-width:1200px;
  margin:50px auto;
  position:relative;
  display:flex;
  justify-content:center;
  align-items: center;
}

.slider{
  width: min(500px, 85vw);
  aspect-ratio: 1/1;
  overflow:hidden;
  border-radius:20px;
  position:relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity .8s ease;
}

.slide.active{opacity:1;}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slider-arrow{
  background:none;
  border:none;
  font-size:40px;
  color:var(--gold);
  cursor:pointer;
  padding: 10px;
  z-index: 10;
}

/* LOJA */
.store{
  display:none;
  padding:40px 20px;
  max-width:1200px;
  margin:auto;
}

.store-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.back-btn{
  background:none;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:10px 20px;
  border-radius:25px;
  cursor:pointer;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:25px;
}

.product{
  background:var(--gray);
  padding:15px;
  border-radius:15px;
  text-align:center;
  transition: 0.3s;
}

.product img{
  width:100%;
  aspect-ratio: 1/1;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:15px;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  text-decoration:none;
  color:#fff;
  z-index: 100;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* RESPONSIVIDADE WEB/DESKTOP */
@media(min-width:1024px){
  .menu-btn:hover { color: #fff; }
  .logo-area h1 { font-size: 22px; }
}

@media(max-width:768px){
  header { padding: 15px; }
  .logo-area h1 { font-size: 14px; }
  .logo-area img { height: 35px; }
  .side-menu { width: 80%; }
}
</style>
</head>

<body>

<div class="top-bar">
🚚 Enviamos para todo o Brasil • Pagamento à vista 3% OFF
</div>

<header id="mainHeader">
  <div class="logo-area">
    <img src="assets/img/logo.png" alt="Logo">
    <h1>LE BLANC UNIFORMES</h1>
  </div>
  <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">☰</div>
</header>

<div class="side-menu" id="menu">
  <a href="#" onclick="toggleSub()">Loja ▾</a>
  <div class="submenu" id="submenu">
    <a onclick="openStore('Jalecos Masculinos')">Jalecos Masculinos</a>
    <a onclick="openStore('Jalecos Femininos')">Jalecos Femininos</a>
    <a onclick="openStore('Uniformes')">Uniformes</a>
    <a onclick="openStore('Aventais')">Aventais</a>
  </div>
  <a>Suporte</a>
  <a>Sobre Nós</a>
</div>

<main id="mainContent">
    <section class="hero" id="home">
      <h2>Elegância que veste o profissional</h2>
      <p>Qualidade, durabilidade e acabamento de alto padrão.</p>

      <div class="search-box">
        <input type="text" placeholder="Buscar por jalecos, uniformes, aventais..." onkeyup="searchProduct(event)">
      </div>
    </section>

    <div class="slider-wrapper" id="sliderArea">
      <button class="slider-arrow" onclick="prevSlide()">‹</button>
      <div class="slider" id="slider">
        <div class="slide active"><img src="assets/img/imagem-1.png"></div>
        <div class="slide"><img src="assets/img/imagem-2.png"></div>
        <div class="slide"><img src="assets/img/imagem-3.png"></div>
        <div class="slide"><img src="assets/img/imagem-4.png"></div>
      </div>
      <button class="slider-arrow" onclick="nextSlide()">›</button>
    </div>

    <section class="store" id="store">
      <div class="store-top">
        <h3 id="storeTitle"></h3>
        <button class="back-btn" onclick="goHome()">← Voltar</button>
      </div>
      <div class="products" id="products"></div>
    </section>
</main>

<a class="whatsapp" href="https://wa.me/5541998096090" target="_blank">💬</a>

<script>
const menu = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");
const submenu = document.getElementById("submenu");
const home = document.getElementById("home");
const store = document.getElementById("store");
const sliderArea = document.getElementById("sliderArea");

function toggleMenu(){
  menu.classList.toggle("active");
  if(menu.classList.contains("active")){
      menuBtn.textContent = "✕";
      document.body.style.overflow = "hidden"; // Trava o scroll ao abrir menu
  } else {
      menuBtn.textContent = "☰";
      document.body.style.overflow = "auto";
  }
}

function toggleSub(){
  submenu.style.display = submenu.style.display === "block" ? "none" : "block";
}

function openStore(title){
  toggleMenu();
  home.style.display = "none";
  sliderArea.style.display = "none";
  store.style.display = "block";
  document.getElementById("storeTitle").innerText = title;
  
  const productsDiv = document.getElementById("products");
  productsDiv.innerHTML = "";
  for(let i=1; i<=6; i++){
    productsDiv.innerHTML += `
      <div class="product">
        <img src="assets/img/placeholder.png">
        <h4>${title} ${i}</h4>
        <span>R$ 100,00</span>
      </div>`;
  }
  window.scrollTo(0,0);
}

function goHome(){
  store.style.display = "none";
  home.style.display = "block";
  sliderArea.style.display = "flex";
  window.scrollTo(0,0);
}

/* SLIDER */
let current = 0;
const slides = document.querySelectorAll(".slide");

function showSlide(i){
  slides.forEach(s => s.classList.remove("active"));
  slides[i].classList.add("active");
}

function nextSlide(){
  current = (current + 1) % slides.length;
  showSlide(current);
}

function prevSlide(){
  current = (current - 1 + slides.length) % slides.length;
  showSlide(current);
}

setInterval(nextSlide, 5000);

// Fecha menu ao clicar fora (opcional mas recomendado)
document.addEventListener('click', (e) => {
    if (menu.classList.contains('active') && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
        toggleMenu();
    }
});
</script>

</body>
</html>
