<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Blanc Uniformes</title>

  <meta name="theme-color" content="#000000" />

  <!-- Fonte parecida com a do modelo (clean e elegante) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1200px;
      min-height: 100vh;
      background: #000;
      color: #d4af37;
    }

    /* HEADER */
    header {
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    header nav a {
      color: #d4af37;
      text-decoration: none;
      margin-left: 24px;
      font-size: 13px;
      opacity: 0.8;
    }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 60px 40px;
      align-items: center;
    }

    .hero-text h2 {
      font-size: 36px;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero-text p {
      font-size: 15px;
      opacity: 0.85;
      margin-bottom: 30px;
      max-width: 420px;
    }

    .hero-text button {
      padding: 14px 32px;
      border-radius: 30px;
      border: none;
      background: #d4af37;
      color: #000;
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    /* IMAGENS DOS JALECOS */
    .hero-images {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .jaleco {
      width: 180px;
      height: 320px;
      border-radius: 120px 120px 24px 24px;
      background-size: cover;
      background-position: center;
    }

    .branco { background: #f5f5f5; }
    .rosa { background: linear-gradient(180deg, #f3b6c4, #e58aa1); }
    .azul { background: linear-gradient(180deg, #9bb7d4, #6f92b8); }

    /* SEÇÃO INFERIOR */
    .section {
      padding: 80px 40px;
      border-top: 1px solid rgba(212,175,55,0.2);
    }

    .section h3 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 20px;
    }

    .section p {
      font-size: 14px;
      max-width: 500px;
      opacity: 0.8;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .hero-images {
        margin-top: 40px;
      }

      header {
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
</head>
  <link rel="manifest" href="manifest.json">
<body>
  <div class="app">

    <header>
      <h1>LE BLANC UNIFORMES</h1>
      <nav>
        <a href="#">Início</a>
        <a href="#">Catálogo</a>
        <a href="#">Contato</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h2>Elegância que veste<br>o profissional</h2>
        <p>
          Jalecos e uniformes premium que unem conforto, estilo e identidade profissional.
        </p>
        <button onclick="window.open('https://wa.me/5541984493134','_blank')">FALE CONOSCO</button>
      </div>

      <div class="hero-images">
        <div class="jaleco branco"></div>
        <div class="jaleco rosa"></div>
        <div class="jaleco azul"></div>
      </div>
    </section>

    <section class="section">
      <h3>Uniformes com identidade</h3>
      <p>
        Criamos peças que valorizam sua imagem profissional, com acabamentos de alto padrão e design moderno.
      </p>
    </section>

  </div>
</body>
</html>
