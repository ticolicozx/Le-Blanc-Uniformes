<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Le Blanc Uniformes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#000;
  color:#d4af37;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #333;
}

header h1{
  margin:0;
}

nav{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
}

nav button{
  background:none;
  border:1px solid #d4af37;
  color:#d4af37;
  padding:10px 20px;
  cursor:pointer;
}

section{
  padding:40px 10%;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:#111;
  padding:15px;
  text-align:center;
}

.card img{
  width:100%;
  height:auto;
}

.back{
  margin-bottom:20px;
}

.back button{
  background:none;
  border:1px solid #d4af37;
  color:#d4af37;
  padding:8px 15px;
  cursor:pointer;
}

/* WhatsApp */
.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#25D366;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
  <h1>Le Blanc Uniformes</h1>
</header>

<nav>
  <button onclick="openProducts()">Ver Produtos</button>
  <button>Contato</button>
</nav>

<section id="home">
  <h2>Uniformes Profissionais</h2>
  <p>Qualidade, elegância e personalização para sua profissão.</p>
</section>

<section id="products" style="display:none;">
  <div class="back">
    <button onclick="goBack()">← Voltar ao menu</button>
  </div>

  <div class="products">
    <div class="card">
      <img src="placeholder.png">
      <p>Jaleco Feminino Premium</p>
    </div>
    <div class="card">
      <img src="placeholder.png">
      <p>Jaleco Masculino Slim</p>
    </div>
    <div class="card">
      <img src="placeholder.png">
      <p>Jaleco Personalizado</p>
    </div>
  </div>
</section>

<a class="whatsapp" href="https://wa.me/5541998096090" target="_blank">🟢</a>

<script>
function openProducts(){
  document.getElementById('home').style.display='none';
  document.getElementById('products').style.display='block';
}

function goBack(){
  document.getElementById('products').style.display='none';
  document.getElementById('home').style.display='block';
}
</script>

</body>
</html>
